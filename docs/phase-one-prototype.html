<title>Crew Sign-up Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column, one question per screen, a charcoal top bar with a
   switch between what the volunteer sees and what the team sees. Type is big on purpose. */
:root {
  --bg: #F4F7F6; --panel: #FFFFFF; --ink: #1F2A2E; --slate: #56666B; --rule: #CFD9D8;
  --teal: #40CFBF; --teal-ink: #0B6F66; --on-teal: #12322F;
  --coral: #F26B4E; --coral-ink: #B8401F; --coral-soft: #FDE9E3;
  --band: #1F2A2E; --band-ink: #F4F7F6; --band-soft: #A9B8BB; --teal-soft: #DDF5F1;
  --map-bg: #E7EFE8; --map-hill: #D6E5D8; --map-hill2: #C6DBC9; --map-hill3: #B5D0BA; --map-water: #8FC4D7;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A1D; --panel: #1B2529; --ink: #E9EFEE; --slate: #A3B3B6; --rule: #33434A;
    --teal-ink: #5FE0D1; --coral-ink: #FF9279; --coral-soft: #3A221C; --band: #0D1315; --teal-soft: #17332F;
    --map-bg: #172225; --map-hill: #1E3032; --map-hill2: #263B3D; --map-hill3: #2F4749; --map-water: #2C5A68;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A1D; --panel: #1B2529; --ink: #E9EFEE; --slate: #A3B3B6; --rule: #33434A;
  --teal-ink: #5FE0D1; --coral-ink: #FF9279; --coral-soft: #3A221C; --band: #0D1315; --teal-soft: #17332F;
  --map-bg: #172225; --map-hill: #1E3032; --map-hill2: #263B3D; --map-hill3: #2F4749; --map-water: #2C5A68;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.45; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; line-height: 1.03; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.bar { background: var(--band); color: var(--band-ink); }
.bar .gut { max-width: 800px; margin: 0 auto; padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 22px; letter-spacing: 0.04em; display: flex; align-items: center; gap: 10px; }
.tag { display: inline-block; background: var(--teal); color: var(--on-teal); transform: skewX(-12deg); padding: 1px 10px; font-size: 13px; letter-spacing: 0.08em; font-weight: 700; }
.tag > span { display: inline-block; transform: skewX(12deg); }
.switch { display: flex; border: 2px solid var(--band-soft); border-radius: 99px; padding: 2px; }
.switch button { background: none; border: 0; border-radius: 99px; padding: 6px 14px; font-size: 15px; font-weight: 600; color: var(--band-ink); }
.switch button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }

main { max-width: 500px; margin: 0 auto; padding-block: 26px 20px; display: flex; flex-direction: column; gap: 18px; }
main.wide { max-width: 800px; }
.step { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--slate); font-weight: 600; min-height: 30px; }
.back { background: none; border: 0; padding: 4px 0; font-weight: 700; color: var(--teal-ink); font-size: 17px; }
h1 { font-size: clamp(40px, 11vw, 56px); font-weight: 800; }
h1 em { font-style: normal; color: var(--teal-ink); }
h2 { font-size: clamp(32px, 9vw, 42px); font-weight: 800; }
.sub { color: var(--slate); }
.choices { display: flex; flex-direction: column; gap: 12px; }
.big { display: block; width: 100%; text-align: left; background: var(--panel); border: 2px solid var(--rule); border-radius: 14px; padding: 18px 18px; font-size: 20px; font-weight: 600; line-height: 1.25; }
.big small { display: block; font-size: 15.5px; font-weight: 400; color: var(--slate); margin-top: 3px; }
.big:hover { border-color: var(--teal-ink); }
.go { display: block; width: 100%; background: var(--teal); color: var(--on-teal); border: 0; border-radius: 14px; padding: 17px 16px; font-size: 20px; font-weight: 700; text-align: center; }
.go:hover { filter: brightness(1.06); }
.plainbtn { background: none; border: 2px solid var(--rule); border-radius: 14px; padding: 14px 16px; font-size: 18px; font-weight: 600; width: 100%; }
.help { text-align: center; color: var(--slate); font-size: 16px; border-top: 1px solid var(--rule); padding-top: 16px; }
.help b { color: var(--ink); white-space: nowrap; }
.event { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.event b { font-family: var(--display); text-transform: uppercase; font-size: 22px; letter-spacing: 0.02em; }
label { font-weight: 700; display: block; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field .why { font-size: 15.5px; color: var(--slate); }
input[type="text"], input[type="tel"] { font: inherit; font-size: 20px; padding: 14px 14px; border: 2px solid var(--rule); border-radius: 12px; background: var(--panel); color: var(--ink); width: 100%; }
.err { background: var(--coral-soft); color: var(--coral-ink); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

.crew { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.who { display: flex; gap: 14px; align-items: center; }
.av { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--teal); color: var(--on-teal); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 34px; }
.crew h3 { font-size: 28px; font-weight: 800; }
.role { color: var(--slate); font-size: 15.5px; }
.hello { font-style: italic; }
.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 16.5px; }
.facts dt { color: var(--slate); font-weight: 600; }
.facts dd { margin: 0; }
.see { background: var(--teal-soft); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.left { color: var(--coral-ink); font-weight: 700; }
.txt { background: var(--panel); border: 1px solid var(--rule); border-radius: 18px 18px 18px 4px; padding: 12px 16px; font-size: 16.5px; }
.cap { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--slate); }

/* List or map: a light-page version of the top bar switch */
.seg { display: flex; border: 2px solid var(--rule); border-radius: 99px; padding: 3px; background: var(--panel); }
.seg button { flex: 1; background: none; border: 0; border-radius: 99px; min-height: 48px; padding: 8px 14px; font-size: 18px; font-weight: 700; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); }

/* Map: positions are worked out in layoutMap() from the real coordinates */
.map { position: relative; width: 100%; min-height: 220px; background: var(--map-bg); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.t1 { fill: var(--map-hill); } .t2 { fill: var(--map-hill2); } .t3 { fill: var(--map-hill3); }
.river { fill: none; stroke: var(--map-water); stroke-width: 4; stroke-linecap: round; }
.route { fill: none; stroke: var(--coral-ink); stroke-width: 3.5; stroke-dasharray: 8 7; stroke-linecap: round; }
.route.alt { stroke-width: 2.5; stroke-dasharray: 4 6; }
.lead { stroke: var(--slate); stroke-width: 2; }
.lead.on { stroke: var(--ink); stroke-width: 3; }
.dot { fill: var(--ink); stroke: var(--panel); stroke-width: 3; }
.dot.on { fill: var(--teal-ink); }
.ring { fill: none; stroke: var(--teal-ink); stroke-width: 3; }
.lmk { fill: var(--slate); }
.pin { position: absolute; left: 0; top: 0; width: max-content; max-width: calc(50% - 20px); min-width: 48px; min-height: 48px; background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 5px 10px 6px; text-align: left; line-height: 1.2; display: flex; flex-direction: column; justify-content: center; }
.pin .pn { font-size: 17px; font-weight: 700; }
.pin .ps { font-size: 15.5px; font-weight: 700; color: var(--coral-ink); }
.pin .ps.full { color: var(--slate); }
.pin .pp { font-size: 15px; font-weight: 700; color: var(--teal-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); border-color: var(--on-teal); box-shadow: 0 0 0 2px var(--on-teal); }
.pin[aria-pressed="true"]::after { content: "\2713"; position: absolute; top: -11px; right: -11px; width: 24px; height: 24px; border-radius: 50%; background: var(--on-teal); color: var(--teal); font-size: 15px; font-weight: 800; line-height: 24px; text-align: center; }
.pin[aria-pressed="true"] .ps, .pin[aria-pressed="true"] .pp { color: var(--on-teal); }
.pin:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.lm { position: absolute; left: 0; top: 0; width: max-content; max-width: 100px; font-size: 15px; line-height: 1.15; font-weight: 600; color: var(--slate); background: var(--map-bg); border-radius: 6px; padding: 1px 5px; }
.mapnote { font-size: 15px; color: var(--slate); margin-top: -10px; }
.tapnote { background: var(--panel); border: 2px dashed var(--rule); border-radius: 14px; padding: 14px 16px; font-weight: 600; text-align: center; }
.placebox { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.placebox h3 { font-size: 30px; font-weight: 800; }

/* Team view */
.sum { display: flex; flex-wrap: wrap; gap: 8px 30px; }
.sum div { display: flex; flex-direction: column; }
.sum b { font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 800; }
.sum span { color: var(--slate); font-size: 15px; }
.rost { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.rhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: baseline; }
.rhead h3 { font-size: 24px; font-weight: 700; }
.pill { font-size: 14px; font-weight: 700; padding: 3px 12px; border-radius: 99px; border: 2px solid var(--rule); white-space: nowrap; }
.pill.need { background: var(--coral-soft); color: var(--coral-ink); border-color: var(--coral-ink); }
.pill.ok { background: var(--teal-soft); color: var(--teal-ink); border-color: var(--teal-ink); }
.meter { height: 12px; background: var(--rule); border-radius: 12px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--teal-ink); }
.names { display: flex; flex-wrap: wrap; gap: 6px; font-size: 15px; }
.names span { border: 1px solid var(--rule); border-radius: 99px; padding: 2px 10px; }
.names .new { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
.names .gap { border-style: dashed; color: var(--slate); }
.ract { display: flex; flex-wrap: wrap; gap: 8px; }
.ract button { background: none; border: 2px solid var(--rule); border-radius: 10px; padding: 7px 14px; font-size: 15.5px; font-weight: 600; }
.ract button:hover { border-color: var(--teal-ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--band); color: var(--band-ink); padding: 12px 18px; border-radius: 12px; font-size: 16px; max-width: min(92vw, 460px); text-align: center; border: 1px solid var(--band-soft); }
.foot { max-width: 800px; margin: 0 auto; padding-block: 8px 40px; color: var(--slate); font-size: 14.5px; text-align: center; }
</style>

<div class="bar"><div class="gut">
  <div class="brand">SingleTrack Crew <span class="tag"><span>Example</span></span></div>
  <div class="switch" role="group" aria-label="Choose a view">
    <button type="button" id="view-vol" data-act="view" data-v="vol" aria-pressed="true">Volunteer view</button>
    <button type="button" id="view-team" data-act="view" data-v="team" aria-pressed="false">Team view</button>
  </div>
</div></div>

<div class="gut"><main id="app"></main></div>
<p class="foot gut">Example page for Phase 1. The places, races and start times are real. The crews, names, jobs, shift times and spots are examples made up for the demo. Nothing you type is saved or sent. Real crew photos replace the initials.</p>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const pool = ['Anh','Bev','Carlos','Dot','Emre','Fiona','Gus','Hana','Ian','Jude','Kev','Lena','Mick','Nadia','Ollie','Priya','Quinn','Rosa','Stu','Tess','Uma','Vic','Wen','Xavier','Yasmin','Zoe','Arlo','Bronte','Col','Dee'];
let pi = 0;
const take = n => Array.from({ length: n }, () => pool[pi++ % pool.length]);
// Real places from the event plan. The crews below are examples.
const places = [
  { id: 'village', short: 'Village Square', name: 'Village Square', lat: -37.14641, lon: 146.44973, races: ['45', '36', '22', '5', 'kids'],
    about: 'Start and finish for every race, with food and water.' },
  { id: 'stirling', short: 'Mt Stirling', name: 'Mt Stirling aid station', lat: -37.12792, lon: 146.49868, races: ['45', '36', '22'],
    about: 'Aid station, open 7am to 1.30pm. On the 22km, 36km and 45km courses.' },
  { id: 'mirimbah', short: 'Mirimbah Park', name: 'Mirimbah Park aid station', lat: -37.11035, lon: 146.40135, races: ['45', '36'],
    about: 'Aid station, open 7.30am to 3.30pm. Public toilets. On the 36km and 45km courses.' },
  { id: 'crossing', short: 'Mirimbah Road<br>crossing', name: 'Mirimbah Road crossing', near: 'mirimbah', races: ['45', '36'],
    about: 'A Course Marshal holds runners here at the road crossing, just beside Mirimbah Park. On the 36km and 45km courses.' }
];
const marks = [
  { id: 'summit', name: 'Mt Buller<br>summit', lat: -37.1455, lon: 146.4270, peak: true },
  { id: 'northside', name: 'Northside<br>Express', lat: -37.14225, lon: 146.44044 },
  { id: 'howqua', name: 'Howqua Gap', lat: -37.14465, lon: 146.49063 },
  { id: 'craigs', name: "Craig's Hut", lat: -37.110, lon: 146.535 }
];
const races = { 45: '45km', 36: '36km', 22: '22km', 5: '5km', kids: '2km Kids' };
const crews = [
  { id: 'stirling', loc: 'stirling', lead: 'Jo', role: 'Aid Station Manager', job: 'Fill bottles and hand out food to runners', place: 'Mt Stirling aid station', time: '7am to 1.30pm', period: 'am', styles: ['feet', 'chat'], need: 2, have: 1,
    perks: 'You work alongside Jo all morning. Bring a warm layer, it is a mountain', hello: "Up on Mt Stirling we keep runners fed, watered and smiling. I need one more mate for the morning.",
    sees: { 45: 'around 9.30am', 36: 'around 9.30am', 22: 'around 10.30am' } },
  { id: 'mirimbah', loc: 'mirimbah', lead: 'Raj', role: 'Aid Station Manager', job: 'Fill bottles and hand out food to runners', place: 'Mirimbah Park aid station', time: '7.30am to 3.30pm', period: 'am', styles: ['feet', 'chat', 'quiet'], need: 2, have: 0,
    perks: 'Public toilets at the park. Bring a camp chair', hello: "Down in the valley at Mirimbah Park. Runners arrive tired and leave smiling. Come and help me look after them.",
    sees: { 45: 'around 12.30pm', 36: 'around 11.30am' } },
  { id: 'crossing', loc: 'crossing', lead: 'Sam', role: 'Course Marshal', job: 'Hold runners at the road crossing until it is safe to go', place: 'Mirimbah Road crossing, beside Mirimbah Park', time: '10.30am to 3.30pm', period: 'mid', styles: ['feet', 'quiet'], need: 2, have: 2,
    perks: 'You work in a pair. Bring a camp chair', hello: "A calm, quiet spot and an important job. Runners always thank you for keeping them safe.",
    sees: { 45: 'around 12.30pm', 36: 'around 11.30am' } },
  { id: 'medals', loc: 'village', lead: 'Deb', role: 'Crew contact', job: 'Hang finish medals around tired necks', place: 'Village Square, at the finish line', time: '10am to 2pm', period: 'mid', styles: ['sit', 'chat'], need: 3, have: 2,
    perks: 'Chairs, shade and coffee close by', hello: "Best job at the event. Every single runner is happy to see you. Chairs for anyone who wants one.", finish: true },
  { id: 'food', loc: 'village', lead: 'Mel', role: 'Crew contact', job: 'Hand out food and drinks to runners at the finish', place: 'Village Square, at the finish', time: '12pm to 4pm', period: 'pm', styles: ['feet', 'chat'], need: 3, have: 1,
    perks: 'Right in the middle of the fun, with music', hello: "We feed hungry runners as they cross the line. Bring your loudest cheer.", finish: true },
  { id: 'kids', loc: 'village', lead: 'Pete', role: 'Crew contact', job: 'Cheer on the kids race and the 5km runners', place: 'Village Square, by the start', time: '9.30am to 12pm', period: 'mid', styles: ['feet', 'chat'], need: 2, have: 1,
    perks: 'Done by lunchtime. Cowbells supplied', hello: "The kids race is the loudest, happiest bit of the day. Come and cheer them home.", finish: true }
];
crews.forEach(c => c.people = take(c.have));

const S = { view: 'vol', step: 'home', runner: null, when: null, style: null, pick: null, me: null, err: '', asked: false, mode: 'list', place: null };
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => crews.find(c => c.id === id);
const spots = c => c.need - c.people.length - (S.me && S.me.crew === c.id ? 1 : 0);
const words = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six'];
const help = '<p class="help">Rather talk to a person? Ring us on <b>[phone]</b> and we will sign you up.</p>';
const stepBar = (n, back) => `<div class="step"><button class="back" type="button" data-act="go" data-s="${back}">&larr; Back</button><span>Step ${n} of 5</span></div>`;
const big = (act, val, title, small) => `<button class="big" type="button" data-act="${act}" data-val="${val}">${title}${small ? `<small>${small}</small>` : ''}</button>`;
const runnerName = () => esc(S.runner.name || 'your runner');

function seeLine(c) {
  if (!S.runner) return '';
  const who = runnerName();
  if (c.finish) return `<p class="see">You will be at the finish when ${who} comes in.</p>`;
  const t = c.sees && c.sees[S.runner.race];
  return t ? `<p class="see">You will see ${who} come through ${t}. That is our best guess. Runners have their own ideas.</p>` : '';
}
function card(c) {
  const n = spots(c), mine = S.me && S.me.crew === c.id;
  return `<article class="crew">
    <div class="who"><span class="av" aria-hidden="true">${c.lead[0]}</span><div><h3>Join ${c.lead}'s crew</h3><p class="role">${c.lead}, ${c.role}</p></div></div>
    <p class="hello">&ldquo;${c.hello}&rdquo;</p>
    <dl class="facts"><dt>The job</dt><dd>${c.job}</dd><dt>When</dt><dd>Sunday, ${c.time}</dd><dt>Where</dt><dd>${c.place}</dd><dt>Good to know</dt><dd>${c.perks}</dd></dl>
    ${seeLine(c)}
    ${mine ? '<p class="see">This is your crew.</p>' : n > 0 ? `<p class="left">${n} ${n === 1 ? 'spot' : 'spots'} left</p><button class="go" type="button" data-act="pick" data-val="${c.id}">I'm with ${c.lead}</button>` : '<p class="left">This crew is full</p>'}
  </article>`;
}
function matches() {
  const score = c => {
    let s = (c.need - c.people.length) / c.need * 2;
    if (S.when && S.when !== 'any' && c.period === S.when) s += 4;
    if (S.style && S.style !== 'any' && c.styles.includes(S.style)) s += 3;
    if (S.style === 'any') s += (c.need - c.people.length) / c.need * 3;
    if (S.runner && (c.finish || (c.sees && c.sees[S.runner.race]))) s += 2;
    return s;
  };
  return crews.filter(c => spots(c) > 0).sort((a, b) => score(b) - score(a)).slice(0, 3);
}

/* ---- Map view ---- */
const at = pl => crews.filter(c => c.loc === pl.id);
const passes = pl => !!S.runner && (S.runner.race === 'unsure' ? pl.id === 'village' : pl.races.includes(S.runner.race));
const seg = () => `<div class="seg" role="group" aria-label="Show the crews as a list or on a map">
    <button type="button" id="mode-list" data-act="mode" data-val="list" aria-pressed="${S.mode === 'list'}">List</button>
    <button type="button" id="mode-map" data-act="mode" data-val="map" aria-pressed="${S.mode === 'map'}">Map</button></div>`;
function pin(pl) {
  const n = at(pl).reduce((a, c) => a + spots(c), 0), mine = S.me && at(pl).some(c => c.id === S.me.crew);
  return `<button type="button" class="pin" id="pin-${pl.id}" data-act="place" data-val="${pl.id}" data-at="${pl.id}" aria-pressed="${S.place === pl.id}">
    <span class="pn">${pl.short}</span><span class="ps${n ? '' : ' full'}">${n ? `${n} ${n === 1 ? 'spot' : 'spots'} left` : 'Full'}</span>${mine ? '<span class="pp">Your crew</span>' : ''}${passes(pl) ? `<span class="pp">&#9733; ${S.runner.name ? runnerName() : 'Your runner'} ${pl.id === 'village' ? 'finishes' : 'passes'}</span>` : ''}</button>`;
}
function placePanel() {
  const pl = places.find(p => p.id === S.place);
  if (!pl) return '<p class="tapnote">Tap a place on the map to see its crews.</p>';
  const cs = at(pl);
  return `<section class="placebox" id="place-box" aria-labelledby="place-head"><h3 id="place-head">${pl.name}</h3><p class="sub">${pl.about}</p>
    <p class="sub">${cs.length === 1 ? 'One crew works here.' : words[cs.length] + ' crews work here.'}</p></section>${cs.map(card).join('')}`;
}
function mapView() {
  const legend = !S.runner ? '' : S.runner.race === 'unsure'
    ? `<p class="see">&#9733; Every race finishes at Village Square, so you will see ${runnerName()} there.</p>`
    : `<p class="see">&#9733; The star shows the places ${runnerName()}'s ${races[S.runner.race]} race goes past.</p>`;
  return `${legend}<div class="map" id="map" role="group" aria-label="Sketch map of Mt Buller. Tap a place to see its crews.">
    <svg id="map-svg" aria-hidden="true" focusable="false"></svg>
    ${places.map(pin).join('')}
    ${marks.map(m => `<span class="lm" data-at="${m.id}">${m.name}</span>`).join('')}
  </div>
  <p class="mapnote">North is up. The dashed line shows the rough course. Sketch only, not to scale.</p>
  ${placePanel()}`;
}
// Simple equirectangular projection: x from longitude, y from latitude, one scale for both.
const KX = 111.32 * Math.cos(37.13 * Math.PI / 180), KY = 111.32, LON0 = 146.40135, LAT0 = -37.110, SPAN = (146.535 - LON0) * KX;
const nearPt = (p, r) => ({ x: Math.min(Math.max(p.x, r.x), r.x + r.w), y: Math.min(Math.max(p.y, r.y), r.y + r.h) });
const smooth = pts => pts.map((p, i) => {
  if (!i) return `M${p.x},${p.y}`;
  const a = pts[i - 2] || pts[i - 1], b = pts[i - 1], c = pts[i + 1] || p;
  return `C${b.x + (p.x - a.x) / 6},${b.y + (p.y - a.y) / 6} ${p.x - (c.x - b.x) / 6},${p.y - (c.y - b.y) / 6} ${p.x},${p.y}`;
}).join(' ');
let mapW = 0;
function layoutMap() {
  const m = document.getElementById('map'); if (!m) return;
  const W = m.clientWidth, pad = 30, s = (W - 2 * pad) / SPAN, P = {}, M = 8;
  if (W < 200) return;
  mapW = W;
  [...places, ...marks].forEach(p => { if (p.lat) P[p.id] = { x: pad + (p.lon - LON0) * KX * s, y: (LAT0 - p.lat) * KY * s }; });
  P.crossing = { x: P.mirimbah.x + 26, y: P.mirimbah.y + 24 };
  // Labels are laid out in rows so they cannot collide at any width from 320px up:
  // above the course, Mirimbah Park and Mt Stirling, then Mirimbah Road crossing and Craig's Hut;
  // inside it, Northside Express and Howqua Gap; below it, the summit and Village Square.
  // Pins keep 11px free above and to the right for the tick shown when selected.
  const dots = Object.values(P), L = {};
  m.querySelectorAll('[data-at]').forEach(el => { el.style.left = el.style.top = '0'; L[el.dataset.at] = { el, w: el.offsetWidth, h: el.offsetHeight }; });
  const put = (id, x, y) => Object.assign(L[id], { x: Math.min(Math.max(x, M), W - M - L[id].w), y, p: P[id] });
  const cr = put('crossing', P.mirimbah.x + 14, -14 - L.crossing.h);
  const ch = put('craigs', W - M - L.craigs.w, -10 - L.craigs.h);
  const rowA = Math.min(cr.y, ch.y) - 18;
  const mi = put('mirimbah', M, rowA - L.mirimbah.h);
  put('stirling', Math.max(Math.min(W - M - L.stirling.w, P.stirling.x - 24), mi.x + mi.w + 14), rowA - L.stirling.h);
  put('northside', P.northside.x - L.northside.w / 2, P.northside.y - 12 - L.northside.h);
  put('howqua', P.howqua.x + 12, P.howqua.y - L.howqua.h / 2);
  const low = Math.max(P.village.y, P.summit.y + 8) + 20;
  const vi = put('village', P.village.x - 30, low);
  put('summit', Math.min(P.summit.x - L.summit.w / 2, vi.x - 12 - L.summit.w), low);
  const placed = Object.values(L).map(r => ({ ...r, b: r.el.classList.contains('pin') ? 11 : 0 }));
  const ys = placed.flatMap(r => [r.y - r.b, r.y + r.h]).concat(dots.flatMap(o => [o.y - 16, o.y + 16]));
  const off = M + 6 - Math.min(...ys), H = Math.ceil(Math.max(...ys) - Math.min(...ys) + 2 * (M + 6));
  m.style.height = H + 'px';
  Object.values(P).forEach(o => { o.y += off; });
  placed.forEach(r => { r.y += off; r.el.style.left = r.x + 'px'; r.el.style.top = r.y + 'px'; });
  const el = (cx, cy, rx, ry, c) => `<ellipse class="${c}" cx="${cx}" cy="${cy}" rx="${rx * s}" ry="${ry * s}"/>`;
  const B = { x: (P.summit.x + P.village.x) / 2, y: (P.summit.y + P.village.y) / 2 }, T = P.stirling;
  const river = smooth([{ x: P.craigs.x + 20, y: P.craigs.y + 0.9 * s }, { x: T.x - 0.5 * s, y: P.mirimbah.y - 0.2 * s }, { x: P.northside.x, y: P.mirimbah.y + 0.6 * s }, { x: P.mirimbah.x - 40, y: P.mirimbah.y + 0.3 * s }]);
  const loop = smooth(['village', 'stirling', 'craigs', 'mirimbah', 'crossing', 'summit', 'village'].map(k => P[k]));
  const spur = smooth(['summit', 'howqua', 'stirling'].map(k => P[k]));
  const leads = placed.map(r => { const e = nearPt(r.p, r), on = r.el.getAttribute('aria-pressed') === 'true';
    return Math.hypot(e.x - r.p.x, e.y - r.p.y) > 4 ? `<line class="lead${on ? ' on' : ''}" x1="${r.p.x}" y1="${r.p.y}" x2="${e.x}" y2="${e.y}"/>` : ''; }).join('');
  const pts = places.map(pl => { const o = P[pl.id], on = S.place === pl.id;
    return `${passes(pl) ? `<circle class="ring" cx="${o.x}" cy="${o.y}" r="16"/>` : ''}<circle class="dot${on ? ' on' : ''}" cx="${o.x}" cy="${o.y}" r="${on ? 11 : 9}"/>`; }).join('');
  const lms = marks.map(k => { const o = P[k.id];
    return k.peak ? `<path class="lmk" d="M${o.x - 8},${o.y + 6} L${o.x},${o.y - 8} L${o.x + 8},${o.y + 6} Z"/>` : `<circle class="lmk" cx="${o.x}" cy="${o.y}" r="5"/>`; }).join('');
  const svg = document.getElementById('map-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = el(B.x, B.y, 3.2, 1.9, 't1') + el(B.x, B.y, 2.1, 1.2, 't2') + el(P.summit.x, P.summit.y, 1, 0.6, 't3')
    + el(T.x, T.y + 0.3 * s, 2.2, 1.4, 't1') + el(T.x, T.y + 0.2 * s, 1.3, 0.8, 't2') + el(T.x, T.y, 0.6, 0.38, 't3')
    + `<path class="river" d="${river}"/><path class="route" d="${loop}"/><path class="route alt" d="${spur}"/>${leads}${lms}${pts}`;
}

const screens = {
  home: () => { const open = crews.filter(c => spots(c) > 0).length; return `
    <h1>Put your hand up. <em>We'll do the rest.</em></h1>
    <div class="event"><span class="cap">Volunteering at</span><b>Mt Buller SkyRun 2026</b><span class="sub">Running Wild series. Sunday 6 December 2026, starting and finishing at Village Square, Mt Buller. ${words[open]} ${open === 1 ? 'crew is' : 'crews are'} looking for helpers.</span></div>
    <p>Answer three easy questions and we will find you a crew. It takes about two minutes and there is no password.</p>
    <button class="go" type="button" data-act="go" data-s="who">Find me a crew</button>
    <button class="plainbtn" type="button" id="home-all" data-act="go" data-s="all">Show me all the crews first</button>
    <button class="plainbtn" type="button" id="home-map" data-act="mapgo">Show me the map</button>
    ${help}`; },
  who: () => `${stepBar(1, 'home')}
    <h2>Who are you here for?</h2>
    <p class="sub">If someone you know is running, we can find you a job where you will see them go past.</p>
    <div class="choices">
      ${big('who', 'yes', 'A runner I know', 'A grandchild, a partner, a mate')}
      ${big('who', 'no', 'Nobody, I just want to help')}
    </div>${help}`,
  race: () => `${stepBar(1, 'who')}
    <h2>Which race are they in?</h2>
    <div class="field"><label for="runner-name">Their first name</label><input type="text" id="runner-name" autocomplete="off" placeholder="Tom" value="${esc(S.runner && S.runner.name || '')}"><span class="why">Only so we can say when to look out for them. We do not keep it.</span></div>
    <div class="choices">
      ${big('race', '45', '45km', 'Starts at 8am')}
      ${big('race', '36', '36km', 'Starts at 8am')}
      ${big('race', '22', '22km', 'Starts at 9am')}
      ${big('race', '5', '5km', 'Starts at 10am')}
      ${big('race', 'kids', '2km Kids', 'Starts at 11am')}
      ${big('race', 'unsure', "I'm not sure")}
    </div>${help}`,
  when: () => `${stepBar(2, 'who')}
    <h2>When are you free on Sunday?</h2>
    <div class="choices">
      ${big('when', 'am', 'Early morning', 'Starts at 7am or 7.30am')}
      ${big('when', 'mid', 'Mid morning', 'Starts between 9.30am and 10.30am')}
      ${big('when', 'pm', 'Middle of the day', 'Starts at 12pm')}
      ${big('when', 'any', 'Any time, I am yours')}
    </div>${help}`,
  style: () => `${stepBar(3, 'when')}
    <h2>What sort of job sounds good?</h2>
    <div class="choices">
      ${big('style', 'sit', 'Sitting down is best')}
      ${big('style', 'feet', 'On my feet, in the action')}
      ${big('style', 'chat', 'Chatting with runners')}
      ${big('style', 'quiet', 'Somewhere quiet in the bush')}
      ${big('style', 'any', 'Put me where I am needed most')}
    </div>${help}`,
  matches: () => `${stepBar(4, 'style')}
    <h2>Pick your crew</h2>
    ${seg()}
    ${S.mode === 'map' ? `<p class="sub">Tap a place on the map to see the crews there.</p>${mapView()}`
      : `<p class="sub">These three suit you best. Each crew has a person who looks after you on the day.</p>
    ${matches().map(card).join('')}
    <button class="plainbtn" type="button" data-act="go" data-s="all">Show me all the crews</button>`}${help}`,
  all: () => `<div class="step"><button class="back" type="button" data-act="go" data-s="${S.me ? 'done' : S.style ? 'matches' : 'home'}">&larr; Back</button><span>All six crews</span></div>
    <h2>${S.me ? 'Swap to another crew' : 'Every crew, every job'}</h2>
    ${seg()}
    ${S.mode === 'map' ? mapView() : crews.map(card).join('')}${help}`,
  details: () => { const c = byId(S.pick); return `${stepBar(5, S.style ? 'matches' : 'all')}
    <h2>Nearly there. Who are you?</h2>
    <p class="sub">You are joining ${c.lead}'s crew: ${c.job.toLowerCase()}, Sunday ${c.time}.</p>
    ${S.err ? `<p class="err" role="alert">${S.err}</p>` : ''}
    <div class="field"><label for="first-name">Your first name</label><input type="text" id="first-name" autocomplete="given-name" placeholder="Margaret"><span class="why">So ${c.lead} knows what to call you.</span></div>
    <div class="field"><label for="mobile">Your mobile number</label><input type="tel" id="mobile" autocomplete="tel" placeholder="04"><span class="why">We text your details and a reminder. This is also how you get back in. No password.</span></div>
    <div class="field"><label for="ec">Someone we can ring for you on the day</label><input type="text" id="ec" autocomplete="off" placeholder="Name and number"><span class="why">Only used if you need help. You can add this later.</span></div>
    <button class="go" type="button" data-act="join">Count me in</button>${help}`; },
  done: () => { const c = byId(S.me.crew), n = esc(S.me.name); return `
    <h1>You're in, <em>${n}!</em></h1>
    <article class="crew">
      <div class="who"><span class="av" aria-hidden="true">${c.lead[0]}</span><div><h3>${c.lead}'s crew</h3><p class="role">${c.lead} is your contact on the day</p></div></div>
      <dl class="facts"><dt>The job</dt><dd>${c.job}</dd><dt>When</dt><dd>Sunday 6 December, ${c.time}</dd><dt>Where</dt><dd>${c.place}</dd><dt>Bring</dt><dd>Hat, water bottle, a warm layer and a smile</dd></dl>
      ${seeLine(c)}
    </article>
    <p class="cap">The text we send you</p>
    <p class="txt">SingleTrack: Hi ${n}, you're in! ${c.lead}'s crew, Sunday ${c.time}, ${c.place.split(',')[0]}. We will text a reminder the day before. Need to change? Reply SWAP or ring [phone].</p>
    ${S.asked ? `<p class="err">Sure you can't make it? ${c.lead} will miss you, but no hard feelings.</p><button class="go" type="button" data-act="leave">Yes, take me off the crew</button><button class="plainbtn" type="button" data-act="keep">No, I'm still coming</button>`
      : `<button class="plainbtn" type="button" id="swap" data-act="go" data-s="all">Swap to a different crew</button><button class="plainbtn" type="button" data-act="ask">I can't make it any more</button>`}
    <button class="go" type="button" data-act="view" data-v="team">See what the team sees</button>${help}`; },
  gone: () => `<h2>No worries. You're off the crew.</h2><p>Thanks for letting us know early. It gives us time to find someone else. We would love to see you at the next one.</p>
    <button class="go" type="button" data-act="go" data-s="home">Start again</button>${help}`
};

function team() {
  const list = crews.map(c => ({ c, names: c.people.slice(), mine: S.me && S.me.crew === c.id }));
  list.forEach(r => { if (r.mine) r.names.push(S.me.name); });
  const filled = list.reduce((a, r) => a + r.names.length, 0), need = crews.reduce((a, c) => a + c.need, 0);
  const short = list.filter(r => r.c.need - r.names.length >= 2).length;
  list.sort((a, b) => (b.c.need - b.names.length) / b.c.need - (a.c.need - a.names.length) / a.c.need);
  return `<h2>Sunday roster, Mt Buller SkyRun</h2>
    <div class="sum"><div><b>${filled} of ${need}</b><span>spots filled</span></div><div><b>${short}</b><span>crews need help</span></div><div><b>${S.me ? 1 : 0}</b><span>new today</span></div></div>
    <p class="sub">Crews with the biggest gaps sit at the top. Sign up in the volunteer view and watch the new name land here.</p>
    <div class="ract"><button type="button" data-act="toast" data-val="In the real thing, a team member types in a name and mobile while the volunteer is on the phone.">Add a volunteer by phone</button><button type="button" data-act="toast" data-val="In the real thing, this prints a roster for every crew as a backup for race day.">Print rosters</button></div>
    ${list.map(({ c, names, mine }) => { const gap = c.need - names.length; return `<div class="rost" id="rost-${c.id}">
      <div class="rhead"><h3>${c.lead}'s crew</h3><span class="pill ${gap >= 2 ? 'need' : 'ok'}">${gap === 0 ? 'Full' : gap >= 2 ? 'Needs ' + gap : 'Needs 1'}</span></div>
      <p class="sub">${c.job}. ${c.place.split(',')[0]}, Sunday ${c.time}.</p>
      <div class="meter" role="img" aria-label="${names.length} of ${c.need} filled"><i style="width:${names.length / c.need * 100}%"></i></div>
      <div class="names">${names.map((n, i) => `<span class="${mine && i === names.length - 1 ? 'new' : ''}">${esc(n)}${mine && i === names.length - 1 ? ' (new)' : ''}</span>`).join('')}${Array.from({ length: gap }, () => '<span class="gap">open</span>').join('')}</div>
      <div class="ract"><button type="button" data-act="toast" data-val="In the real thing, this sends a text and an email to everyone on ${c.lead}'s crew.">Message this crew</button>${gap >= 2 ? `<button type="button" data-act="toast" data-val="In the real thing, this asks past volunteers if they can help fill ${c.lead}'s crew.">Ask past volunteers</button>` : ''}</div>
    </div>`; }).join('')}`;
}

function render(focus) {
  app.className = S.view === 'team' ? 'wide' : '';
  app.innerHTML = S.view === 'team' ? team() : screens[S.step]();
  layoutMap();
  document.getElementById('view-vol').setAttribute('aria-pressed', S.view === 'vol');
  document.getElementById('view-team').setAttribute('aria-pressed', S.view === 'team');
  if (focus) { window.scrollTo(0, 0); const h = app.querySelector('h1, h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); h.style.outline = 'none'; } }
}
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 4200); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.val;
  S.err = '';
  if (a === 'view') S.view = b.dataset.v;
  else if (a === 'go') { S.step = b.dataset.s; S.asked = false; }
  else if (a === 'mapgo') { S.mode = 'map'; S.step = 'all'; }
  else if (a === 'mode') { S.mode = v; render(false); document.getElementById('mode-' + v).focus(); return; }
  else if (a === 'place') {
    S.place = v; render(false); document.getElementById('pin-' + v).focus();
    const h = document.getElementById('place-head'), r = h.getBoundingClientRect();
    if (r.top > innerHeight * 0.6 || r.top < 0) window.scrollBy({ top: r.top - innerHeight * 0.35, behavior: 'smooth' });
    return;
  }
  else if (a === 'who') { if (v === 'yes') S.step = 'race'; else { S.runner = null; S.step = 'when'; } }
  else if (a === 'race') { const n = document.getElementById('runner-name').value.trim(); S.runner = { name: n, race: v }; S.step = 'when'; }
  else if (a === 'when') { S.when = v; S.step = 'style'; }
  else if (a === 'style') { S.style = v; S.step = 'matches'; }
  else if (a === 'pick') { if (S.me) { S.me.crew = v; S.step = 'done'; toast('Swapped. ' + byId(v).lead + ' knows you are coming.'); } else { S.pick = v; S.step = 'details'; } }
  else if (a === 'join') {
    const n = document.getElementById('first-name').value.trim(), m = document.getElementById('mobile').value.replace(/\s/g, '');
    if (!n) { S.err = 'Please tell us your first name.'; }
    else if (!/^\+?\d{8,12}$/.test(m)) { S.err = 'That mobile number does not look right. It should be 10 digits, starting with 04.'; }
    else { S.me = { name: n, crew: S.pick }; S.step = 'done'; }
    if (S.err) { const keep = [n, document.getElementById('mobile').value, document.getElementById('ec').value]; render(true); ['first-name', 'mobile', 'ec'].forEach((id, i) => { document.getElementById(id).value = keep[i]; }); return; }
  }
  else if (a === 'ask') S.asked = true;
  else if (a === 'keep') S.asked = false;
  else if (a === 'leave') { S.me = null; S.asked = false; S.pick = null; S.step = 'gone'; }
  else if (a === 'toast') { toast(v); return; }
  render(true);
});
addEventListener('resize', () => { const m = document.getElementById('map'); if (m && m.clientWidth !== mapW) layoutMap(); });
if (document.fonts) document.fonts.ready.then(layoutMap);
render(false);
</script>
